[project]
name = "yggdras-orchestrate"
version = "0.1.0"
description = "Session orchestration: Temporal holds the loop, headless Agent SDK workers do the work."
requires-python = ">=3.12"
dependencies = ["claude-agent-sdk>=0.1.60", "temporalio>=1.36,<2"]

[project.scripts]
orchestrate = "orchestrate.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
