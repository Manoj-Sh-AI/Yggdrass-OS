name: Application foundation
on:
  push:
    branches: [main]
    paths: ['app/web/**', 'app/api/**', 'app/desktop/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['app/web/**', 'app/api/**', 'app/desktop/**', '.github/workflows/frontend.yml']
jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - run: npm ci --prefix app/web
      - name: Compile Windows host
        shell: pwsh
        run: ./app/desktop/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-host-without-private-configuration
          path: |
            app/desktop/dist/*.exe
            app/desktop/dist/*.dll
            app/desktop/dist/*.ico
            app/desktop/dist/*LICENSE.txt
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: yggdress_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Disposable CI service only. Runtime roles/passwords are generated by the tests.
      YGGDRESS_TEST_POSTGRES: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: yggdress_test
    defaults:
      run:
        working-directory: app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/web/package-lock.json
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --project ../api
      - name: Install verified local Temporal test server
        run: uv run --project ../api python ../api/scripts/install_temporal.py --directory ../api/runtime/temporal-tools
      - run: uv run --project ../api ruff check ../api/src ../api/tests ../api/scripts
      - run: uv run --project ../api ruff format --check ../api/src ../api/tests ../api/scripts
      - run: uv run --project ../api pytest ../api/tests
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
      - run: npm run test:e2e -- agents.spec.ts
        env:
          PLAYWRIGHT_CHANNEL: chromium
          YGGDRESS_SYNTHETIC_AGENTS: '1'
          YGGDRESS_TEMPORAL_AGENTS: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results
          path: app/web/test-results
