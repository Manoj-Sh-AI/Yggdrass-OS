<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yggdras brain map</title>
<style>
@font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("inter-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: swap;
  src: url("inter-latin-600-normal.woff2") format("woff2"); }
:root {
  --bg: #f4efe6; --panel: #fbf8f2; --text: #26241f; --text-2: #6f6a62; --line: #e4ddd0;
  --accent: #b8692e; --chip: #efe9de; --shadow: 0 6px 24px rgba(40,34,24,0.14); --tip: #fffdf8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202226; --panel: #24272c; --text: #e6e7ea; --text-2: #9a9fa6; --line: #33373e;
    --accent: #d9a35b; --chip: #2d3036; --shadow: 0 6px 24px rgba(0,0,0,0.45); --tip: #2a2d33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202226; --panel: #24272c; --text: #e6e7ea; --text-2: #9a9fa6; --line: #33373e;
  --accent: #d9a35b; --chip: #2d3036; --shadow: 0 6px 24px rgba(0,0,0,0.45); --tip: #2a2d33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
#graph, #graph3d, #labels3d { position: absolute; inset: 0 360px 0 0; background: var(--bg); }
#labels3d { background: transparent; pointer-events: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 12px; background: var(--chip); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 600; }
#side { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; background: var(--panel);
  border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; }
h1 { font-size: 15px; margin: 0; letter-spacing: 0.01em; font-weight: 600; }
h2 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); margin: 16px 0 6px; font-weight: 600; }
h4 { font-size: 12px; margin: 10px 0 4px; color: var(--text-2); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
select, input[type="search"], button { font: inherit; color: var(--text); background: var(--chip);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
input[type="search"] { width: 100%; margin-top: 12px; }
#results { list-style: none; margin: 4px 0 0; padding: 0; }
#results li, .jump { cursor: pointer; padding: 4px 6px; border-radius: 6px; }
#results li:hover, .jump:hover { background: var(--chip); }
.toggles label, .filter label { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
.toggles .row { margin-bottom: 6px; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.filter { max-height: 220px; overflow-y: auto; padding-left: 2px; }
.count { color: var(--text-2); margin-left: auto; font-variant-numeric: tabular-nums; }
.swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
#info { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
#info .empty { color: var(--text-2); font-style: italic; }
#info ul { margin: 4px 0; padding-left: 18px; }
#info li { margin: 2px 0; }
.muted { color: var(--text-2); }
.hidden-note { background: var(--chip); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
a { color: var(--accent); }
.legend-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.legend-item canvas, .legend-item svg { flex: none; }
#tip { position: fixed; z-index: 10; max-width: 340px; background: var(--tip); color: var(--text);
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; box-shadow: var(--shadow);
  pointer-events: none; font-size: 12px; }
#tip b { font-size: 13px; font-weight: 600; }
#loading { position: absolute; left: 16px; bottom: 14px; color: var(--text-2); font-size: 12px; }
#stats { color: var(--text-2); font-size: 11px; margin-top: 14px; }
@media (max-width: 800px) {
  #graph, #graph3d, #labels3d { inset: 0 0 45vh 0; }
  #side { top: auto; height: 45vh; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
<script src="vis-network.min.js"></script>
</head>
<body>
<div id="graph" aria-label="Brain map"></div>
<div id="graph3d" aria-label="Brain map in 3D" hidden></div>
<canvas id="labels3d" hidden></canvas>
<div id="loading">Laying out…</div>
<aside id="side">
  <div class="row">
    <h1>Yggdras brain map</h1>
    <select id="theme" aria-label="Theme">
      <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
    </select>
  </div>
  <input id="search" type="search" placeholder="Search notes, aliases…" autocomplete="off" aria-label="Search">
  <ul id="results"></ul>
  <div class="toggles">
    <h3>View</h3>
    <div class="row"><span>Map</span>
      <span class="seg" role="group" aria-label="2D or 3D"><button id="dim-2d" type="button" aria-pressed="true">2D</button><button id="dim-3d" type="button" aria-pressed="false">3D</button></span>
    </div>
    <div class="row"><span>Style</span>
      <select id="style" aria-label="Graph style">
        <option value="classic">Classic</option><option value="graphite">Graphite</option><option value="clouds">Area clouds</option>
      </select>
    </div>
    <div class="row" id="colour-by-row"><span>Colour by</span>
      <select id="colour-by" aria-label="Colour by">
        <option value="area">Life area</option><option value="group">Type group</option>
      </select>
    </div>
    <label><input type="checkbox" id="hide-hubs"> Hide hubs and their links</label>
    <label><input type="checkbox" id="edge-labels"> Show link labels when zoomed in</label>
    <label><input type="checkbox" id="show-mentions" checked> Show mentions</label>
  </div>
  <div id="counts" class="muted" style="margin-top:10px"></div>
  <div id="info"><span class="empty">Click a note to see its details.</span></div>
  <h3>Filters</h3>
  <details><summary>Areas</summary><div class="filter" id="f-area"></div></details>
  <details><summary>Types</summary><div class="filter" id="f-type"></div></details>
  <details><summary>Link verbs</summary><div class="filter" id="f-verb"></div></details>
  <h3>Legend</h3>
  <details open><summary id="l-area-title">Colours: areas</summary><div id="l-area"></div></details>
  <details><summary>Sizes and lines</summary><div id="l-line"></div></details>
  <div id="stats"></div>
</aside>
<div id="tip" hidden></div>
<script>
"use strict";
window.addEventListener("error", (e) => { document.body.dataset.error = String(e.message || e); });
const DATA = /*__YGGDRAS_DATA__*/null;
const T0 = performance.now();

// ---------------------------------------------------------------- constants
const AREA_NAMES = {
  "01-health": "Health", "02-relationships": "Relationships", "03-work-career": "Work and career",
  "04-learning": "Learning", "05-money": "Money", "06-purpose": "Purpose",
  "07-home-admin": "Home and admin", "08-rest-joy": "Rest and joy", "cross": "Cross-area",
};
// Area hues; every area is drawn at the same saturation and lightness, so none shouts.
const AREA_HUE = { "01-health": 150, "02-relationships": 330, "03-work-career": 212, "04-learning": 40,
  "05-money": 178, "06-purpose": 268, "07-home-admin": 22, "08-rest-joy": 2, "cross": 220 };
// Graph colours per theme (the sidebar has its own CSS tokens).
const LOOK = {
  dark: { bg: "#202226", node: "#9fa4ab", hub: "#c2c6cc", edge: "rgba(170,176,184,0.30)", hubEdge: "rgba(170,176,184,0.13)",
    label: "#959aa1", strong: "#eceef1", accent: "#d9a35b", halo: "rgba(32,34,38,0.85)", veil: "rgba(32,34,38,0.80)",
    areaS: 30, areaL: 64, cloudA: 0.13 },
  light: { bg: "#f4efe6", node: "#8e897f", hub: "#625d55", edge: "rgba(96,90,80,0.30)", hubEdge: "rgba(96,90,80,0.13)",
    label: "#7a756c", strong: "#24221e", accent: "#b8692e", halo: "rgba(244,239,230,0.88)", veil: "rgba(244,239,230,0.80)",
    areaS: 32, areaL: 46, cloudA: 0.12 },
};
const STYLES = ["classic", "graphite", "clouds"];
// Classic: the look of the first demo viewer (flat solid circles, thin straight grey links,
// no labels at rest), coloured by type group or by life area.
const CLASSIC = {
  dark: { bg: "#151514", edge: "rgba(220,220,210,0.18)", focus: "rgba(245,245,240,0.92)", label: "#ececea", muted: "#9a9a94",
    halo: "rgba(21,21,20,0.85)", veil: "rgba(21,21,20,0.82)", card: "#1f1f1d", cardLine: "#33332f", areaL: 55 },
  light: { bg: "#fafaf7", edge: "rgba(60,60,55,0.22)", focus: "rgba(29,29,27,0.88)", label: "#1d1d1b", muted: "#6b6b66",
    halo: "rgba(250,250,247,0.88)", veil: "rgba(250,250,247,0.82)", card: "#ffffff", cardLine: "#e3e2dc", areaL: 45 },
};
const GROUPS = {
  hub: ["Hubs and areas", "#d9822b"], person: ["People", "#2f7ed8"], knowledge: ["Knowledge", "#3a9d5d"],
  source: ["Sources", "#8e5cc4"], chunk: ["Chunks", "#c44d6b"], doing: ["Doings", "#2a9d8f"],
  place: ["Places", "#c9a23a"], other: ["Other", "#8a8a85"],
};
function groupOf(n) {
  if (n.type === "hub" || n.type === "area") return "hub";
  if (n.type === "person") return "person";
  if (["concept", "framework"].includes(n.type) || (n.type === "topic" && n.shelf === "topics")) return "knowledge";
  if (n.type === "chunk" || (n.type === "source" && n.path.split("/").length > 2)) return "chunk";
  if (n.type === "source") return "source";
  if (["project", "goal", "decision", "event", "journal", "topic"].includes(n.type)) return "doing";
  if (n.type === "place") return "place";
  return "other";
}
const N = DATA.nodes.length;
const BIG = N > 1000;
const LABEL_PX = 11.5;
const FONT = '"Inter", system-ui, -apple-system, "Segoe UI", sans-serif';

// ---------------------------------------------------------------- indexes
const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
const edgeById = new Map(DATA.edges.map((e) => [e.id, e]));
const adj = new Map(DATA.nodes.map((n) => [n.id, new Set()]));
const edgesOf = new Map(DATA.nodes.map((n) => [n.id, []]));
for (const e of DATA.edges) {
  adj.get(e.from).add(e.to); adj.get(e.to).add(e.from);
  edgesOf.get(e.from).push(e); if (e.to !== e.from) edgesOf.get(e.to).push(e);
}
const colourKey = (n) => n.area || n.shelf;
const keys = [...new Set(DATA.nodes.map(colourKey))].sort();
const extraKeys = keys.filter((k) => !(k in AREA_HUE));
const degrees = DATA.nodes.filter((n) => n.type !== "hub").map((n) => n.degree).sort((a, b) => b - a);
const ALWAYS_DEGREE = Math.max(5, degrees[Math.floor(degrees.length * 0.06)] || 0);
const verbKey = (e) => (e.kind === "mention" ? "mentions" : e.label);

// Colour neighbourhoods: hidden springs pull each note towards the anchor of its colour
// group (the group's hub, or its most-linked note), so notes of one colour sit together.
// Hidden edges are not drawn but take part in the layout. "a" springs (long, gentle) group
// by life area for Area clouds; "b" (short, firm) by life area and "g" by type group for Classic.
function springs(prefix, keyOf) {
  const anchors = new Map();
  const rank = (m) => (m.type === "hub" ? 1e6 : 0) + m.degree;
  for (const n of DATA.nodes) {
    const k = keyOf(n);
    if (!k || k === "cross") continue;
    const cur = anchors.get(k);
    if (!cur || rank(n) > rank(cur)) anchors.set(k, n);
  }
  const out = [];
  for (const n of DATA.nodes) {
    const a = anchors.get(keyOf(n));
    if (a && a.id !== n.id) out.push({ id: `${prefix}${out.length}`, from: n.id, to: a.id });
  }
  return out;
}
const CLOUD_EDGES = [
  ...springs("a", colourKey).map((e) => ({ ...e, length: 150 })),
  ...springs("b", colourKey).map((e) => ({ ...e, length: 40 })),
  ...springs("g", (n) => groupOf(n)).map((e) => ({ ...e, length: 40 })),
];
// Which springs the current style and colouring use: "a", "g" or none.
function springSet() {
  if (state.style === "clouds") return "a";
  if (state.style === "classic") return state.colourBy === "area" ? "b" : "g";
  return "";
}

// ---------------------------------------------------------------- state
const state = { hideHubs: false, edgeLabels: false, mentions: true, areaOff: new Set(),
  typeOff: new Set(), verbOff: new Set(), hover: null, selected: null, revealed: new Set(),
  pinned: new Set(), theme: "dark", style: "classic", colourBy: "area", layout: "force", ring: false };
let visible = new Set(DATA.nodes.map((n) => n.id));

function storeGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* private mode */ } }
const hash = new URLSearchParams(location.hash.slice(1));

function dark() {
  if (state.theme === "dark") return true;
  if (state.theme === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
let L = LOOK.light;
function areaColour(n, alpha = 1) {
  const k = colourKey(n);
  const hue = k in AREA_HUE ? AREA_HUE[k] : (extraKeys.indexOf(k) * 47 + 90) % 360;
  const s = k === "cross" ? 8 : L.areaS;
  return `hsla(${hue}, ${s}%, ${L.areaL}%, ${alpha})`;
}
const classic = () => state.style === "classic";
function classicArea(k) {
  const hue = k in AREA_HUE ? AREA_HUE[k] : (extraKeys.indexOf(k) * 47 + 90) % 360;
  return `hsl(${hue}, ${k === "cross" ? 6 : 55}%, ${L.areaL}%)`;
}
function swatch(k) { return classic() ? classicArea(k) : areaColour({ area: k, shelf: k }); }
// Blended colours (Classic): a note linked to other colour groups shows 65% its own colour
// and 35% the link-weighted average of its neighbours' colours, mixed in OKLab so blends
// stay clean. Hub "lists" links don't count. A note with no links to another group keeps
// its pure colour. The legend shows pure colours only.
const BLEND = Math.min(1, Math.max(0, Number(hash.get("blend") || 0.35)));
function pureKey(n) { return state.colourBy === "area" ? colourKey(n) : groupOf(n); }
function pureColour(n) { return state.colourBy === "area" ? classicArea(colourKey(n)) : GROUPS[groupOf(n)][1]; }
function toRgb(c) {
  if (c[0] === "#") return [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16) / 255);
  const [h, sat, l] = c.match(/[\d.]+/g).map(Number);
  const S = sat / 100, Li = l / 100, k = (x) => (x + h / 30) % 12, a = S * Math.min(Li, 1 - Li);
  return [0, 8, 4].map((x) => Li - a * Math.max(-1, Math.min(k(x) - 3, 9 - k(x), 1)));
}
const lin = (c) => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4));
const gam = (c) => (c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055);
function toOklab(rgb) {
  const [r, g, b] = rgb.map(lin);
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s2 = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s2,
    1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s2,
    0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s2];
}
function fromOklab([L0, A, B]) {
  const l = Math.pow(L0 + 0.3963377774 * A + 0.2158037573 * B, 3);
  const m = Math.pow(L0 - 0.1055613458 * A - 0.0638541728 * B, 3);
  const s2 = Math.pow(L0 - 0.0894841775 * A - 1.291485548 * B, 3);
  const rgb = [4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s2,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s2,
    -0.0041960863 * l - 0.7034186147 * m + 1.707614701 * s2];
  return "#" + rgb.map((c) => Math.round(Math.min(1, Math.max(0, gam(c))) * 255).toString(16).padStart(2, "0")).join("");
}
// Blends are made in OKLCH: lightness mixes straight, hue turns the short way round, and
// chroma stays at least the average of the two colours, so opposite hues (yellow and blue)
// meet as a colour, not as grey. Grey notes (Cross-area, or the "Other" type group) take no
// part: they are never blended and never tint or count as a foreign colour. The hue turns at
// most 20°, so a bridge keeps its own colour family (yellow toward blue must not read as green).
const MAX_HUE_SHIFT = (20 * Math.PI) / 180;
const toLch = ([l, a, b]) => [l, Math.hypot(a, b), Math.atan2(b, a)];
const fromLch = ([l, c, h]) => [l, c * Math.cos(h), c * Math.sin(h)];
const isGrey = (n) => { const k = pureKey(n); return k === "cross" || k === "other"; };
function mixLch(own, other, t) {
  const dh = ((other[2] - own[2] + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
  return [own[0] + (other[0] - own[0]) * t,
    Math.max(own[1] + (other[1] - own[1]) * t, (own[1] + other[1]) / 2),
    own[2] + Math.max(-MAX_HUE_SHIFT, Math.min(MAX_HUE_SHIFT, dh * t))];
}
let blended = new Map();
function computeBlends() {
  blended = new Map();
  if (!classic()) return;
  const lch = new Map(DATA.nodes.map((n) => [n.id, toLch(toOklab(toRgb(pureColour(n))))]));
  for (const n of DATA.nodes) {
    if (isGrey(n)) { blended.set(n.id, pureColour(n)); continue; }
    const k = pureKey(n);
    let w = 0, cross = false, l = 0, c = 0, hx = 0, hy = 0;
    for (const e of edgesOf.get(n.id)) {
      if (e.kind === "hub") continue;
      const o = e.from === n.id ? e.to : e.from;
      const m = byId.get(o);
      if (o === n.id || isGrey(m)) continue;
      if (pureKey(m) !== k) cross = true;
      const v = lch.get(o);
      l += v[0]; c += v[1]; hx += Math.cos(v[2]); hy += Math.sin(v[2]); w++;
    }
    if (!cross) { blended.set(n.id, pureColour(n)); continue; }
    const avg = [l / w, c / w, Math.atan2(hy, hx)];
    blended.set(n.id, fromOklab(fromLch(mixLch(lch.get(n.id), avg, BLEND))));
  }
}
// While "Colour by" changes, colours cross-fade: the animation sets these per frame.
let colourOverride = null;
function nodeColour(n, inFocus) {
  if (classic()) return (colourOverride && colourOverride.get(n.id)) || blended.get(n.id) || pureColour(n);
  if (inFocus || state.areaOff.size) return areaColour(n);
  return n.type === "hub" ? L.hub : L.node;
}
// Classic node sizes: 40% bigger than the first demo viewer at today's size, then scaled by
// s = clamp(sqrt(80 / visible notes), 0.45, 1), so a growing brain doesn't crowd and
// filtering down makes notes bigger again. Labels and link widths don't scale.
function sizeFactor(count) { return Math.min(1, Math.max(0.45, Math.sqrt(80 / Math.max(count, 1)))); }
let SIZE = sizeFactor(DATA.nodes.length);
function radius(n) {
  if (classic()) return (4 + Math.sqrt(Math.min(n.degree, 40)) * 2.2) * (groupOf(n) === "chunk" ? 0.7 : 1) * 1.4 * SIZE;
  if (n.type === "hub") return 12;
  return 4 + 8.5 * Math.sqrt(Math.min(n.degree, 30) / 30);
}
const show = (n) => !n.sensitive || state.revealed.has(n.id);

// Theme and style are settled before the graph exists: updating every link after the
// network starts would restart its layout.
state.style = STYLES.includes(hash.get("style")) ? hash.get("style") : (STYLES.includes(storeGet("yggdras-style")) ? storeGet("yggdras-style") : "classic");
state.theme = hash.get("theme") || storeGet("yggdras-theme") || "dark";
state.colourBy = (hash.get("colour") || storeGet("yggdras-colour-by")) === "group" ? "group" : "area";
if (state.theme !== "system") document.documentElement.setAttribute("data-theme", state.theme);
// The graph's colours: the current style's look for the current theme.
function look() {
  const t = dark() ? "dark" : "light", base = LOOK[t];
  if (!classic()) return base;
  const c = CLASSIC[t];
  return { ...base, bg: c.bg, edge: c.edge, hubEdge: c.edge, label: c.muted, strong: c.label, accent: c.focus,
    halo: c.halo, veil: c.veil, areaL: c.areaL, card: c.card, cardLine: c.cardLine, muted: c.muted };
}
L = look();

// ---------------------------------------------------------------- nodes: circles only
function drawNode(ctx, n, x, y, opts = {}) {
  const r = radius(n) * (opts.grow || 1);
  ctx.save();
  if (n.type === "hub" && !classic()) {
    ctx.shadowColor = nodeColour(n, opts.focus); ctx.shadowBlur = 12;
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
  ctx.fillStyle = nodeColour(n, opts.focus); ctx.fill();
  ctx.shadowBlur = 0;

    ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, 2 * Math.PI);

// ---- positions: computed once per page, like the 2D layouts
// Tuned on the real brain: head-on stays close to 2D (mean shift 0.15 of the map radius)
// while depth reaches about 0.85 of the map width.
const ANCHOR3D = 0.3;

function flatPositions() {

  const out = {};
  for (const n of DATA.nodes) {
    let p = g3.flat[n.id];
    if (!p) {
      const near = [...adj.get(n.id)].map((id) => g3.flat[id]).filter(Boolean);
      p = near.length
        ? { x: near.reduce((s, q) => s + q.x, 0) / near.length, y: near.reduce((s, q) => s + q.y, 0) / near.length }
        : { x: 0, y: 0 };

}
function positions3d() {
  if (g3.pos) return g3.pos;
  // A real 3D web that starts from the 2D map: every note begins at its 2D place with a
  // depth spread as wide as the map, then a deterministic 3D force layout runs (notes push
  // apart in every direction, links pull their two notes together). A gentle pull towards each note's 2D place keeps the head-on view
  // recognisably the 2D map, while turning it shows depth as deep as the map is wide.
  const flat = flatPositions(), nodes = DATA.nodes, M = nodes.length, rnd = lcg(11);
  const ps = nodes.map((n) => ({ x: flat[n.id].x, y: -flat[n.id].y, z: 0 }));
  let cx = 0, cy = 0;

  for (const q of ps) { q.x -= cx; q.y -= cy; }
  const home = ps.map((q) => ({ x: q.x, y: q.y }));
  const radii = ps.map((q) => Math.hypot(q.x, q.y)).sort((a, b) => a - b);
  const R = Math.max(radii[Math.floor((M - 1) * 0.9)] || 1, 1);
  for (const q of ps) q.z = (rnd() * 2 - 1) * R * 0.9;
  const idx = new Map(nodes.map((n, i) => [n.id, i]));
  const links = DATA.edges.map((e) => [idx.get(e.from), idx.get(e.to)]).filter(([a, b]) => a !== b);
  // The natural spacing: the median 2D link length (the 2D layout already chose it).
  const lens = links.map(([a, b]) => Math.hypot(ps[a].x - ps[b].x, ps[a].y - ps[b].y)).sort((a, b) => a - b);
  const K = Math.max(lens[Math.floor(lens.length / 2)] || R / 4, 10);
  const iters = Math.max(40, Math.min(300, Math.floor(4e7 / Math.max(M * M, 1))));
  const CUT2 = (K * 4) ** 2;
  const fx = new Float64Array(M), fy = new Float64Array(M), fz = new Float64Array(M);
  let temp = K;
  for (let it = 0; it < iters; it++) {
    fx.fill(0); fy.fill(0); fz.fill(0);
    for (let i = 0; i < M; i++) {
      const a = ps[i];
      for (let j = i + 1; j < M; j++) {
        const b = ps[j];
        let x = a.x - b.x, y = a.y - b.y, z = a.z - b.z;
        const d2 = Math.max(x * x + y * y + z * z, 1);
        if (d2 > CUT2) continue; // only near notes push: far groups are not shoved away
        const s = (K * K) / d2;
        x *= s; y *= s; z *= s;
        fx[i] += x; fy[i] += y; fz[i] += z; fx[j] -= x; fy[j] -= y; fz[j] -= z;

    for (const [a, b] of links) {
      const p = ps[a], q = ps[b];
      const x = q.x - p.x, y = q.y - p.y, z = q.z - p.z, s = Math.hypot(x, y, z) / K;
      fx[a] += x * s; fy[a] += y * s; fz[a] += z * s; fx[b] -= x * s; fy[b] -= y * s; fz[b] -= z * s;
    }
    for (let i = 0; i < M; i++) {
      const q = ps[i], h = home[i];
      // Towards the 2D place (x, y only), and softly back from beyond the map's width (z).
      fx[i] += (h.x - q.x) * ANCHOR3D; fy[i] += (h.y - q.y) * ANCHOR3D;
      fz[i] -= q.z * ANCHOR3D * 0.25; // a gentle pull to the middle: unlinked groups stay near
      const len = Math.hypot(fx[i], fy[i], fz[i]);
      if (len > 0) { const step = Math.min(len, temp) / len; q.x += fx[i] * step; q.y += fy[i] * step; q.z += fz[i] * step; }
    }
    temp = Math.max(K * 0.02, temp * 0.985);

  // Fit back to the 2D map's size and place (one scale for all three axes, so depth keeps
  // its proportion): least squares between the head-on view and the 2D places.
  let mx = 0, my = 0, mz = 0;
  for (const q of ps) { mx += q.x / M; my += q.y / M; mz += q.z / M; }
  let num = 0, den = 0;
  ps.forEach((q, i) => { num += (q.x - mx) * home[i].x + (q.y - my) * home[i].y; den += (q.x - mx) ** 2 + (q.y - my) ** 2; });
  const s = den > 0 ? num / den : 1;
  for (const q of ps) { q.x = (q.x - mx) * s; q.y = (q.y - my) * s; q.z = (q.z - mz) * s; }
  const pos = {};
  nodes.forEach((n, i) => { pos[n.id] = ps[i]; });
  g3.pos = pos; g3.R = R;
  return pos;
}
// Head-on, at the distance that shows what the 2D view fits, so 3D opens on the same picture.
function home3d(ms) {
  // Fit the whole web from any side: centre on its middle and stand back far enough that a
  // sphere around every note fits the narrower side of the view, whichever way it is turned.
  const pos = positions3d(), cam = g3.graph.camera(), list = [...visible].map((id) => pos[id]);
  const mid = { x: 0, y: 0, z: 0 };
  for (const q of list) { mid.x += q.x / list.length; mid.y += q.y / list.length; mid.z += q.z / list.length; }
  const far = list.map((q) => Math.hypot(q.x - mid.x, q.y - mid.y, q.z - mid.z)).sort((a, b) => a - b);
  const rb = Math.max(far[far.length - 1] || 1, 1); // every note in view, like the 2D fit
  const zoom = Number(hash.get("zoom")) > 0 && !g3.homed ? Number(hash.get("zoom")) : 1;
  const on = !g3.homed && DATA.nodes.find((m) => m.slug === hash.get("center"));
  const at = on ? pos[on.id] : mid;
  const half = (cam.fov * Math.PI) / 360, aspect = box3.clientWidth / Math.max(box3.clientHeight, 1);
  const fit = Math.min(Math.sin(half), Math.sin(Math.atan(Math.tan(half) * aspect)));
  const D = (rb * 0.9) / fit / zoom;

  const turn = (!g3.homed && Number(hash.get("turn"))) || 0, a = (turn * Math.PI) / 180;

  g3.graph.cameraPosition({ x: at.x + D * Math.sin(a), y: at.y, z: at.z + D * Math.cos(a) }, at, ms);

// ---- flat discs facing the camera: one texture per colour (and glow), shared
function discTexture(colour, glow) {
  const key = `${colour}|${glow ? 1 : 0}`;

  const s = 128, c = document.createElement("canvas"); c.width = c.height = s;
  const x = c.getContext("2d"), r = glow ? s * 0.3 : s * 0.46;
  if (glow) {

    g.addColorStop(0, colour); g.addColorStop(1, "rgba(0,0,0,0)");

  }

}

  // neighbours stay in view.
  const p = positions3d()[id], cam = g3.graph.camera().position;
  let dir = { x: cam.x - p.x, y: cam.y - p.y, z: cam.z - p.z };
  const c = Math.hypot(dir.x, dir.y, dir.z);
  dir = c > 1 ? { x: dir.x / c, y: dir.y / c, z: dir.z / c } : { x: 0, y: 0, z: 1 };
  const back = g3.R * 1.1;
  const ms = animate && !reduceMotion() ? 900 : 0;
  g3.graph.cameraPosition({ x: p.x + dir.x * back, y: p.y + dir.y * back, z: p.z + dir.z * back }, p, ms);
  document.body.dataset.flyMs = String(ms);
  document.body.dataset.selected3d = byId.get(id).slug;
}
function deselect3d() { state.selected = null; showInfo(null); setFocus3d(state.hover); delete document.body.dataset.selected3d; }

// ---- labels: like 2D. Hubs and the most-linked notes always; more as the camera comes
// closer; the focused note and its neighbours when focused; never overlapping (the
// lower-ranked one is left out); any name on hover, in the tooltip.
function resize3d() {
  if (!g3.graph) return;
  const w = box3.clientWidth, h = box3.clientHeight, dpr = devicePixelRatio || 1;
  g3.graph.width(w).height(h);
  lab3.width = w * dpr; lab3.height = h * dpr; lab3.style.width = `${w}px`; lab3.style.height = `${h}px`;
  // Redraw the scene and the labels now, at the new size, so the two never disagree.
  const cam = g3.graph.camera(), r = g3.graph.renderer();
  r.setSize(w, h); cam.aspect = w / Math.max(h, 1); cam.updateProjectionMatrix();
  r.render(g3.graph.scene(), cam);
  drawLabels3d();
  g3.dirty++;
}
function drawLabels3d() {
  const ctx = lab3.getContext("2d"), dpr = devicePixelRatio || 1, w = box3.clientWidth, h = box3.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  const cam = g3.graph.camera(), pos = positions3d(), v = new THREE.Vector3();
  const near = g3.focus ? new Set([g3.focus, ...adj.get(g3.focus)]) : null;
  const k = h / (2 * Math.tan((cam.fov * Math.PI) / 360));
  const cand = [];
  for (const id of visible) {
    const p = pos[id], n = byId.get(id);
    v.set(p.x, p.y, p.z);
    const dist = cam.position.distanceTo(v);
    v.project(cam);
    if (v.z < -1 || v.z > 1) continue;
    const x = ((v.x + 1) / 2) * w, y = ((1 - v.y) / 2) * h;
    if (x < 0 || x > w || y < 0 || y > h) continue;
    const important = n.type === "hub" || n.degree >= ALWAYS_DEGREE;
    const close = dist < g3.R * 1.3;
    if (near ? !near.has(id) : !important && !close) continue;
    const rank = (id === g3.focus ? 1e9 : 0) + (important ? 1e6 : 0) + n.degree * 1000 - dist;
    cand.push([rank, n, x, y + (radius(n) * k) / Math.max(dist, 1) + 3]);
  }
  cand.sort((a, b) => b[0] - a[0]);
  const boxes = [];
  ctx.textAlign = "center"; ctx.textBaseline = "top"; ctx.lineJoin = "round";
  for (const [, n, x, y] of cand) {
    if (boxes.length > 300) break;
    const strong = n.id === g3.focus;
    ctx.font = `${strong ? 600 : 400} ${LABEL_PX}px ${FONT}`;
    const text = short(n.name), tw = ctx.measureText(text).width, th = LABEL_PX * 1.3;
    const b = { x0: x - tw / 2 - 2, y0: y, x1: x + tw / 2 + 2, y1: y + th };
    if (boxes.some((q) => b.x0 < q.x1 && b.x1 > q.x0 && b.y0 < q.y1 && b.y1 > q.y0)) continue;
    boxes.push(b);
    ctx.lineWidth = 2.5; ctx.strokeStyle = L.halo; ctx.strokeText(text, x, y);
    ctx.fillStyle = strong ? L.strong : L.label; ctx.fillText(text, x, y);
  }
  g3.boxes = boxes;
  document.body.dataset.labels3d = String(boxes.length);
  if (hash.get("debug") === "labels") document.body.dataset.boxes3d = JSON.stringify(boxes.map((b) => [b.x0, b.y0, b.x1, b.y1].map(Math.round)));
}
function labelLoop() {
  if (state.dim === "3d" && g3.graph) {
    const key = `${g3.graph.camera().matrixWorld.elements.map((e) => e.toFixed(2)).join(",")}|${g3.dirty}`;
    if (key !== g3.camKey) { g3.camKey = key; drawLabels3d(); }
  }
  requestAnimationFrame(labelLoop);
}
function debugColours(tries = 0) {
  if (hash.get("debug") !== "colours") return;
  document.body.dataset.colours2d = JSON.stringify(Object.fromEntries(DATA.nodes.map((n) => [n.slug, nodeColour(n, false)])));
  if (!g3.graph) return;
  // The sprites are made on the first frames after the data is set: wait for all of them.
  if (g3.sprites.size < visible.size && tries < 120) { requestAnimationFrame(() => debugColours(tries + 1)); return; }
  document.body.dataset.colours3d = JSON.stringify(Object.fromEntries([...g3.sprites].map(([id, sp]) => [byId.get(id).slug, sp.userData.colour])));
}

function init3d() {
  if (g3.graph) return;
  const G = ForceGraph3D({ controlType: "orbit" })(box3)
    .backgroundColor(L.bg).showNavInfo(false)
    .nodeThreeObject((d) => sprite3d(byId.get(d.id)))
    .nodeLabel(() => "")
    .linkColor(linkColour3d).linkOpacity(0.4).linkWidth(0)
    .enableNodeDrag(false).warmupTicks(0).cooldownTicks(1)
    .onNodeHover(hover3d)
    .onNodeClick((d) => select3d(d.id, true))
    .onBackgroundClick(deselect3d);
  // No forces move anything: every note is pinned. The link force stays, at strength 0,
  // because it is what joins each link to its two notes.
  G.d3Force("charge", null); G.d3Force("center", null); G.d3Force("link").strength(0);
  const controls = G.controls();
  if (controls) {
    controls.enableDamping = !reduceMotion();
    // A drag or the wheel (OrbitControls' start/end) stops the turn while it lasts.
    controls.addEventListener("start", () => { g3.dragging = true; touched3d(); });
    controls.addEventListener("end", () => { g3.dragging = false; touched3d(); });
  }
  box3.addEventListener("pointerdown", touched3d);
  g3.graph = G;
  G.graphData(graphData3d());
  box3.addEventListener("mousemove", (ev) => {
    g3.mouse = { x: ev.clientX, y: ev.clientY };
    if (state.hover != null && !tip.hidden) tipAtPage(nodeTipHtml(byId.get(state.hover)), ev.clientX, ev.clientY);
  });
  if (window.ResizeObserver) new ResizeObserver(resize3d).observe(box3);
  else addEventListener("resize", resize3d);
  requestAnimationFrame(labelLoop);
}
function update3d() {
  if (!g3.graph) return;
  g3.graph.graphData(graphData3d());
  setFocus3d(focusId());
  g3.dirty++;
  debugColours();
}

// ---- the switch: same selection, filters and search; the choice is remembered
function hintLine() {
  document.getElementById("counts").textContent = `${N} notes, ${DATA.edges.length} links. ` + (state.dim === "3d"
    ? "Turns slowly; hover or click a note to stop it. Drag to turn, right-drag to pan, wheel to zoom."
    : "Drag to pan, wheel to zoom, drag a note to move it.");
}
function markDim() {
  for (const d of DIMS) {
    const b = document.getElementById(`dim-${d}`);
    b.setAttribute("aria-pressed", String(state.dim === d));
  }
  document.body.dataset.dim = state.dim;
  hintLine();
}
async function setDim(d, remember) {
  state.dim = d;
  if (remember) storeSet("yggdras-dim", d);
  markDim();
  const flat = document.getElementById("graph");
  if (d === "3d") {
    try { await load3d(); } catch (err) { document.body.dataset.error = String(err.message || err); return; }
    if (state.dim !== "3d") return;
    await ready2d;
    if (state.dim !== "3d") return;
    flat.hidden = true; box3.hidden = false; lab3.hidden = false;
    g3.pos = null; // the 2D places may have changed (layout, drags) since 3D was last open
    init3d(); resize3d(); update3d(); g3.graph.resumeAnimation();
    home3d(0);
    if (state.selected && visible.has(state.selected)) select3d(state.selected, false);
    debugColours();
    if (hash.get("debug") === "same") {
      // How far each 3D note sits from its 2D place (y flipped, both centred): should be 0.
      const flat = flatPositions(), pos = positions3d(), ids = DATA.nodes.map((n) => n.id);
      const mx = ids.reduce((s, id) => s + flat[id].x, 0) / ids.length, my = ids.reduce((s, id) => s + flat[id].y, 0) / ids.length;
      const off = ids.reduce((s, id) => s + Math.hypot(pos[id].x - (flat[id].x - mx), pos[id].y + (flat[id].y - my)), 0) / ids.length;
      const span = (k) => Math.max(...ids.map((id) => pos[id][k])) - Math.min(...ids.map((id) => pos[id][k]));
      const far = Math.max(...ids.map((id) => Math.hypot(pos[id].x, pos[id].y, pos[id].z))) / g3.R;
      document.body.dataset.same = JSON.stringify({ off: off / g3.R, depth: span("z") / Math.max(span("x"), span("y")), far });
    }
    if (hash.get("debug") === "interact" && g3.graph.controls()) {
      // Record the turn before, during and right after a drag (the tests read these).
      const c = g3.graph.controls(), out = { before: document.body.dataset.spin };
      c.dispatchEvent({ type: "start" }); out.during = document.body.dataset.spin;
      c.dispatchEvent({ type: "end" }); out.after = document.body.dataset.spin;
      document.body.dataset.interact = JSON.stringify(out);
    }
    document.body.dataset.ready3d = "1";
  } else {
    box3.hidden = true; lab3.hidden = true; tip.hidden = true;
    if (g3.graph) g3.graph.pauseAnimation();
    flat.hidden = false; network.setSize("100%", "100%"); network.redraw();
    if (state.selected && visible.has(state.selected)) goTo(state.selected, false);
  }
}
for (const d of DIMS) document.getElementById(`dim-${d}`).addEventListener("click", () => setDim(d, true));

// ---------------------------------------------------------------- theme and style
const themeSel = document.getElementById("theme"), styleSel = document.getElementById("style");
function applyLook(edges = true) {
  L = look();
  computeBlends();
  nodesDS.update(DATA.nodes.map((n) => ({ id: n.id, color: nodeColourOpt(n) })));
  document.getElementById("colour-by").disabled = !classic();
  document.getElementById("colour-by-row").title = classic() ? "" : "Colour by applies to the Classic style";
  document.getElementById("graph").style.background = L.bg;
  if (edges && classic()) {
    const ids = DATA.edges.map((e) => e.id);
    edgesDS.remove(ids);
    edgesDS.add(DATA.edges.map((e) => ({ id: e.id, from: e.from, to: e.to, ...edgeStyle(e) })));
  } else if (edges) edgesDS.update(DATA.edges.map((e) => ({ id: e.id, ...edgeStyle(e) })));
  legend(); if (state.selected) showInfo(state.selected);
  network.redraw();
  if (g3 && g3.graph) restyle3d();
}
function applyTheme(t) {
  state.theme = t; themeSel.value = t;
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  applyLook();
}
function applyStyle(s, initial) {
  const was = springSet();
  state.style = STYLES.includes(s) ? s : "classic"; styleSel.value = state.style;
  edgesView.refresh(); network.setOptions({ edges: { smooth: smoothing() } });
  nodesDS.update(DATA.nodes.map((n) => ({ id: n.id, size: radius(n) })));
  applyLook();
  if (!initial && was !== springSet()) relayoutGlide(null);
}
themeSel.addEventListener("change", () => { storeSet("yggdras-theme", themeSel.value); applyTheme(themeSel.value); });
styleSel.addEventListener("change", () => { storeSet("yggdras-style", styleSel.value); applyStyle(styleSel.value, false); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "system") applyLook(); });
const colourSel = document.getElementById("colour-by");
colourSel.addEventListener("change", () => {
  const was = springSet(), before = shownColours();
  state.colourBy = colourSel.value; storeSet("yggdras-colour-by", colourSel.value);
  edgesView.refresh();
  if (classic() && !reduceMotion() && !BIG) colourOverride = before;
  applyLook(false);
  if (was !== springSet()) relayoutGlide(before);
  else if (colourOverride) {
    const pos = network.getPositions();
    colourOverride = null;
    const after = shownColours();
    colourOverride = before;
    glide(pos, pos, 1000, easeInOut, { from: before, to: after }, null);
  }
});
themeSel.value = state.theme; styleSel.value = state.style; colourSel.value = state.colourBy;
applyLook(false);
if (hash.get("labels") === "1") { state.edgeLabels = true; document.getElementById("edge-labels").checked = true; }
if (document.fonts) document.fonts.load(`400 12px "Inter"`).then(() => network.redraw()).catch(() => {});
document.getElementById("stats").textContent = `${N} notes · ${DATA.edges.length} links`;
markDim();
debugColours();
if (state.dim === "3d") {
  setDim("3d", false).then(() => {
    const sel = DATA.nodes.find((m) => m.slug === hash.get("select"));
    if (sel && g3.graph) goTo(sel.id, false);
  });
}
hintLine();
// Tests: press the 2D button as Manoj would (the choice is remembered for the next visit).
if (hash.get("debug") === "click2d") document.getElementById("dim-2d").click();
</script>
</body>
