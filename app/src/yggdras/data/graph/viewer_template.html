<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yggdras brain map</title>
<style>
@font-face { font-family: "Inter"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("inter-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 600; font-style: normal; font-display: swap;
  src: url("inter-latin-600-normal.woff2") format("woff2"); }
:root {
  --bg: #f4efe6; --panel: #fbf8f2; --text: #26241f; --text-2: #6f6a62; --line: #e4ddd0;
  --accent: #b8692e; --chip: #efe9de; --shadow: 0 6px 24px rgba(40,34,24,0.14); --tip: #fffdf8;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202226; --panel: #24272c; --text: #e6e7ea; --text-2: #9a9fa6; --line: #33373e;
    --accent: #d9a35b; --chip: #2d3036; --shadow: 0 6px 24px rgba(0,0,0,0.45); --tip: #2a2d33;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #202226; --panel: #24272c; --text: #e6e7ea; --text-2: #9a9fa6; --line: #33373e;
  --accent: #d9a35b; --chip: #2d3036; --shadow: 0 6px 24px rgba(0,0,0,0.45); --tip: #2a2d33;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
#graph { position: absolute; inset: 0 360px 0 0; background: var(--bg); }
#side { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; background: var(--panel);
  border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; }
h1 { font-size: 15px; margin: 0; letter-spacing: 0.01em; font-weight: 600; }
h2 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); margin: 16px 0 6px; font-weight: 600; }
h4 { font-size: 12px; margin: 10px 0 4px; color: var(--text-2); font-weight: 600; }
.row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
select, input[type="search"], button { font: inherit; color: var(--text); background: var(--chip);
  border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
input[type="search"] { width: 100%; margin-top: 12px; }
#results { list-style: none; margin: 4px 0 0; padding: 0; }
#results li, .jump { cursor: pointer; padding: 4px 6px; border-radius: 6px; }
#results li:hover, .jump:hover { background: var(--chip); }
.toggles label, .filter label { display: flex; align-items: center; gap: 7px; padding: 2px 0; cursor: pointer; }
.toggles .row { margin-bottom: 6px; }
details { border-top: 1px solid var(--line); padding: 6px 0; }
summary { cursor: pointer; font-weight: 600; padding: 4px 0; }
.filter { max-height: 220px; overflow-y: auto; padding-left: 2px; }
.count { color: var(--text-2); margin-left: auto; font-variant-numeric: tabular-nums; }
.swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }
.chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 1px 8px; margin: 2px 4px 2px 0; font-size: 12px; }
#info { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; }
#info .empty { color: var(--text-2); font-style: italic; }
#info ul { margin: 4px 0; padding-left: 18px; }
#info li { margin: 2px 0; }
.muted { color: var(--text-2); }
.hidden-note { background: var(--chip); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
a { color: var(--accent); }
.legend-item { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
.legend-item canvas, .legend-item svg { flex: none; }
#tip { position: fixed; z-index: 10; max-width: 340px; background: var(--tip); color: var(--text);
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; box-shadow: var(--shadow);
  pointer-events: none; font-size: 12px; }
#tip b { font-size: 13px; font-weight: 600; }
#loading { position: absolute; left: 16px; bottom: 14px; color: var(--text-2); font-size: 12px; }
#stats { color: var(--text-2); font-size: 11px; margin-top: 14px; }
#legend-card { position: absolute; top: 12px; left: 12px; z-index: 5; border-radius: 8px; padding: 10px 12px; font-size: 13px; max-width: 520px; }
#legend-card b { display: block; margin-bottom: 4px; }
#legend-card .dot { display: inline-flex; align-items: center; gap: 6px; margin-right: 10px; }
#legend-card i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
#legend-card .s { margin-top: 4px; }
@media (max-width: 800px) {
  #graph { inset: 0 0 45vh 0; }
  #side { top: auto; height: 45vh; width: 100%; border-left: 0; border-top: 1px solid var(--line); }
}
</style>
<script src="vis-network.min.js"></script>
</head>
<body>
<div id="graph" aria-label="Brain map"></div>
<div id="legend-card" hidden></div>
<div id="loading">Laying out…</div>
<aside id="side">
  <div class="row">
    <h1>Yggdras brain map</h1>
    <select id="theme" aria-label="Theme">
      <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
    </select>
  </div>
  <input id="search" type="search" placeholder="Search notes, aliases…" autocomplete="off" aria-label="Search">
  <ul id="results"></ul>
  <div class="toggles">
    <h3>View</h3>
    <div class="row"><span>Style</span>
      <select id="style" aria-label="Graph style">
        <option value="classic">Classic</option><option value="graphite">Graphite</option><option value="muted">Muted areas</option><option value="clouds">Area clouds</option>
      </select>
    </div>
    <div class="row" id="colour-by-row"><span>Colour by</span>
      <select id="colour-by" aria-label="Colour by">
        <option value="group">Type group</option><option value="area">Life area</option>
      </select>
    </div>
    <label><input type="checkbox" id="hide-hubs"> Hide hubs and their links</label>
    <label><input type="checkbox" id="edge-labels"> Show link labels when zoomed in</label>
    <label><input type="checkbox" id="show-mentions" checked> Show mentions</label>
  </div>
  <div id="info"><span class="empty">Click a note to see its details.</span></div>
  <h3>Filters</h3>
  <details><summary>Areas</summary><div class="filter" id="f-area"></div></details>
  <details><summary>Types</summary><div class="filter" id="f-type"></div></details>
  <details><summary>Link verbs</summary><div class="filter" id="f-verb"></div></details>
  <h3>Legend</h3>
  <details open><summary id="l-area-title">Colours: areas</summary><div id="l-area"></div></details>
  <details><summary>Sizes and lines</summary><div id="l-line"></div></details>
  <div id="stats"></div>
</aside>
<div id="tip" hidden></div>
<script>
"use strict";
window.addEventListener("error", (e) => { document.body.dataset.error = String(e.message || e); });
const DATA = /*__YGGDRAS_DATA__*/null;
const T0 = performance.now();

// ---------------------------------------------------------------- constants
const AREA_NAMES = {
  "01-health": "Health", "02-relationships": "Relationships", "03-work-career": "Work and career",
  "04-learning": "Learning", "05-money": "Money", "06-purpose": "Purpose",
  "07-home-admin": "Home and admin", "08-rest-joy": "Rest and joy", "cross": "Cross-area",
};
// Area hues; every area is drawn at the same saturation and lightness, so none shouts.
const AREA_HUE = { "01-health": 150, "02-relationships": 330, "03-work-career": 212, "04-learning": 40,
  "05-money": 178, "06-purpose": 268, "07-home-admin": 22, "08-rest-joy": 2, "cross": 220 };
// Graph colours per theme (the sidebar has its own CSS tokens).
const LOOK = {
  dark: { bg: "#202226", node: "#9fa4ab", hub: "#c2c6cc", edge: "rgba(170,176,184,0.30)", hubEdge: "rgba(170,176,184,0.13)",
    label: "#959aa1", strong: "#eceef1", accent: "#d9a35b", halo: "rgba(32,34,38,0.85)", veil: "rgba(32,34,38,0.80)",
    areaS: 30, areaL: 64, cloudA: 0.13 },
  light: { bg: "#f4efe6", node: "#8e897f", hub: "#625d55", edge: "rgba(96,90,80,0.30)", hubEdge: "rgba(96,90,80,0.13)",
    label: "#7a756c", strong: "#24221e", accent: "#b8692e", halo: "rgba(244,239,230,0.88)", veil: "rgba(244,239,230,0.80)",
    areaS: 32, areaL: 46, cloudA: 0.12 },
};
const STYLES = ["classic", "graphite", "muted", "clouds"];
// Classic: the look of the first demo viewer (flat solid circles, thin straight grey links,
// no labels at rest), coloured by type group or by life area.
const CLASSIC = {
  dark: { bg: "#151514", edge: "rgba(220,220,210,0.18)", focus: "rgba(245,245,240,0.92)", label: "#ececea", muted: "#9a9a94",
    halo: "rgba(21,21,20,0.85)", veil: "rgba(21,21,20,0.82)", card: "#1f1f1d", cardLine: "#33332f", areaL: 55 },
  light: { bg: "#fafaf7", edge: "rgba(60,60,55,0.22)", focus: "rgba(29,29,27,0.88)", label: "#1d1d1b", muted: "#6b6b66",
    halo: "rgba(250,250,247,0.88)", veil: "rgba(250,250,247,0.82)", card: "#ffffff", cardLine: "#e3e2dc", areaL: 45 },
};
const GROUPS = {
  hub: ["Hubs and areas", "#d9822b"], person: ["People", "#2f7ed8"], knowledge: ["Knowledge", "#3a9d5d"],
  source: ["Sources", "#8e5cc4"], chunk: ["Chunks", "#c44d6b"], doing: ["Doings", "#2a9d8f"],
  place: ["Places", "#c9a23a"], other: ["Other", "#8a8a85"],
};
function groupOf(n) {
  if (n.type === "hub" || n.type === "area") return "hub";
  if (n.type === "person") return "person";
  if (["topic", "concept", "framework"].includes(n.type)) return "knowledge";
  if (n.type === "chunk" || (n.type === "source" && n.path.split("/").length > 2)) return "chunk";
  if (n.type === "source") return "source";
  if (["project", "goal", "decision", "event", "journal"].includes(n.type)) return "doing";
  if (n.type === "place") return "place";
  return "other";
}
const N = DATA.nodes.length;
const BIG = N > 1000;
const LABEL_PX = 11.5;
const FONT = '"Inter", system-ui, -apple-system, "Segoe UI", sans-serif';

// ---------------------------------------------------------------- indexes
const byId = new Map(DATA.nodes.map((n) => [n.id, n]));
const edgeById = new Map(DATA.edges.map((e) => [e.id, e]));
const adj = new Map(DATA.nodes.map((n) => [n.id, new Set()]));
const edgesOf = new Map(DATA.nodes.map((n) => [n.id, []]));
for (const e of DATA.edges) {
  adj.get(e.from).add(e.to); adj.get(e.to).add(e.from);
  edgesOf.get(e.from).push(e); if (e.to !== e.from) edgesOf.get(e.to).push(e);
}
const colourKey = (n) => n.area || n.shelf;
const keys = [...new Set(DATA.nodes.map(colourKey))].sort();
const extraKeys = keys.filter((k) => !(k in AREA_HUE));
const degrees = DATA.nodes.filter((n) => n.type !== "hub").map((n) => n.degree).sort((a, b) => b - a);
const ALWAYS_DEGREE = Math.max(5, degrees[Math.floor(degrees.length * 0.06)] || 0);
const verbKey = (e) => (e.kind === "mention" ? "mentions" : e.label);

// Area clouds: hidden springs pull each note gently towards its area's anchor (its hub, or
// its most-linked note). Hidden edges are not drawn but take part in the layout.
const anchors = new Map();
for (const n of DATA.nodes) {
  const k = colourKey(n);
  if (!k || k === "cross") continue;
  const cur = anchors.get(k);
  const rank = (m) => (m.type === "hub" ? 1e6 : 0) + m.degree;
  if (!cur || rank(n) > rank(cur)) anchors.set(k, n);
}
const CLOUD_EDGES = [];
for (const n of DATA.nodes) {
  const a = anchors.get(colourKey(n));
  if (a && a.id !== n.id) CLOUD_EDGES.push({ id: `c${CLOUD_EDGES.length}`, from: n.id, to: a.id });
}

// ---------------------------------------------------------------- state
const state = { hideHubs: false, edgeLabels: false, mentions: true, areaOff: new Set(),
  typeOff: new Set(), verbOff: new Set(), hover: null, selected: null, revealed: new Set(),
  pinned: new Set(), theme: "dark", style: "classic", colourBy: "group" };
let visible = new Set(DATA.nodes.map((n) => n.id));

function storeGet(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (_) { /* private mode */ } }
const hash = new URLSearchParams(location.hash.slice(1));

function dark() {
  if (state.theme === "dark") return true;
  if (state.theme === "light") return false;
  return matchMedia("(prefers-color-scheme: dark)").matches;
}
let L = LOOK.light;
function areaColour(n, alpha = 1) {
  const k = colourKey(n);
  const hue = k in AREA_HUE ? AREA_HUE[k] : (extraKeys.indexOf(k) * 47 + 90) % 360;
  const s = k === "cross" ? 8 : L.areaS;
  return `hsla(${hue}, ${s}%, ${L.areaL}%, ${alpha})`;
}
const classic = () => state.style === "classic";
function classicArea(k) {
  const hue = k in AREA_HUE ? AREA_HUE[k] : (extraKeys.indexOf(k) * 47 + 90) % 360;
  return `hsl(${hue}, ${k === "cross" ? 6 : 55}%, ${L.areaL}%)`;
}
function swatch(k) { return classic() ? classicArea(k) : areaColour({ area: k, shelf: k }); }
function nodeColour(n, inFocus) {
  if (classic()) return state.colourBy === "area" ? classicArea(colourKey(n)) : GROUPS[groupOf(n)][1];
  if (state.style === "muted" || inFocus || state.areaOff.size) return areaColour(n);
  return n.type === "hub" ? L.hub : L.node;
}
function radius(n) {
  if (classic()) return (4 + Math.sqrt(Math.min(n.degree, 40)) * 2.2) * (groupOf(n) === "chunk" ? 0.7 : 1);
  if (n.type === "hub") return 12;
  return 4 + 8.5 * Math.sqrt(Math.min(n.degree, 30) / 30);
}
const show = (n) => !n.sensitive || state.revealed.has(n.id);

// Theme and style are settled before the graph exists: updating every link after the
// network starts would restart its layout.
state.style = STYLES.includes(hash.get("style")) ? hash.get("style") : (STYLES.includes(storeGet("yggdras-style")) ? storeGet("yggdras-style") : "classic");
state.theme = hash.get("theme") || storeGet("yggdras-theme") || "dark";
state.colourBy = (hash.get("colour") || storeGet("yggdras-colour-by")) === "area" ? "area" : "group";
if (state.theme !== "system") document.documentElement.setAttribute("data-theme", state.theme);
// The graph's colours: the current style's look for the current theme.
function look() {
  const t = dark() ? "dark" : "light", base = LOOK[t];
  if (!classic()) return base;
  const c = CLASSIC[t];
  return { ...base, bg: c.bg, edge: c.edge, hubEdge: c.edge, label: c.label, strong: c.label, accent: c.focus,
    halo: c.halo, veil: c.veil, areaL: c.areaL, card: c.card, cardLine: c.cardLine, muted: c.muted };
}
L = look();

// ---------------------------------------------------------------- nodes: circles only
function drawNode(ctx, n, x, y, opts = {}) {
  const r = radius(n);
  ctx.save();
  if (n.type === "hub" && !classic()) {
    ctx.shadowColor = nodeColour(n, opts.focus); ctx.shadowBlur = 12;
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, 2 * Math.PI);
  ctx.fillStyle = nodeColour(n, opts.focus); ctx.fill();
  ctx.shadowBlur = 0;
  if (opts.selected && !classic()) {
    ctx.beginPath(); ctx.arc(x, y, r + 3.5, 0, 2 * Math.PI);
    ctx.lineWidth = 1.5; ctx.strokeStyle = L.accent; ctx.stroke();
  }
  if (state.pinned.has(n.id)) {
    ctx.beginPath(); ctx.arc(x, y, Math.max(1.6, r * 0.28), 0, 2 * Math.PI);
    ctx.fillStyle = L.bg; ctx.fill();
  }
  ctx.restore();
}
function renderer({ ctx, id, x, y, state: s }) {
  const n = byId.get(id), r = radius(n);
  return { drawNode() { drawNode(ctx, n, x, y, { selected: s.selected }); }, nodeDimensions: { width: 2 * r, height: 2 * r } };
}

// ---------------------------------------------------------------- data sets
function edgeStyle(e) {
  const c = e.kind === "hub" ? L.hubEdge : L.edge;
  const col = { color: c, highlight: c, hover: c, inherit: false, opacity: 1 };
  if (classic()) return { width: 1, dashes: false, color: col };
  if (e.kind === "mention") return { width: 0.6, dashes: [2, 3], color: col };
  return { width: e.kind === "hub" ? 0.6 : 0.8, dashes: false, color: col };
}
const nodesDS = new vis.DataSet(DATA.nodes.map((n) => ({ id: n.id, shape: "custom", ctxRenderer: renderer, size: radius(n) })));
const edgesDS = new vis.DataSet([
  ...DATA.edges.map((e) => ({ id: e.id, from: e.from, to: e.to, ...edgeStyle(e) })),
  ...CLOUD_EDGES.map((c) => ({ ...c, hidden: true, length: 150 })),
]);
function nodeVisible(n) {
  return !(state.hideHubs && n.type === "hub") && !state.areaOff.has(colourKey(n)) && !state.typeOff.has(n.type);
}
const nodesView = new vis.DataView(nodesDS, { filter: (item) => nodeVisible(byId.get(item.id)) });
const edgesView = new vis.DataView(edgesDS, {
  filter: (item) => {
    if (typeof item.id === "string") return state.style === "clouds" && visible.has(item.from) && visible.has(item.to);
    const e = edgeById.get(item.id);
    if (state.hideHubs && e.kind === "hub") return false;
    if (!state.mentions && e.kind === "mention") return false;
    if (state.verbOff.has(verbKey(e))) return false;
    return visible.has(e.from) && visible.has(e.to);
  },
});
function refresh() {
  visible = new Set(DATA.nodes.filter(nodeVisible).map((n) => n.id));
  nodesView.refresh(); edgesView.refresh();
  if (state.selected && !visible.has(state.selected)) { state.selected = null; showInfo(null); }
  network.redraw();
}

// ---------------------------------------------------------------- network
// Slight curves, except in Classic and above 1,000 notes, where curves slow the layout.
function smoothing() { return BIG || classic() ? false : { enabled: true, type: "curvedCW", roundness: 0.08 }; }
const network = new vis.Network(document.getElementById("graph"), { nodes: nodesView, edges: edgesView }, {
  layout: { improvedLayout: !BIG, randomSeed: 7 },
  physics: {
    solver: "forceAtlas2Based",
    // Large brains: fewer iterations and no overlap pass, which is the costly part of the layout.
    forceAtlas2Based: { gravitationalConstant: -70, centralGravity: 0.01, springLength: 110, springConstant: 0.06, damping: 0.55, avoidOverlap: BIG ? 0 : 0.7 },
    stabilization: { enabled: true, iterations: BIG ? 120 : 500, updateInterval: BIG ? 40 : 25, fit: true },
    minVelocity: 0.75, timestep: 0.45,
  },
  edges: { smooth: smoothing(), selectionWidth: 0, hoverWidth: 0, arrows: { to: { enabled: false } } },
  interaction: { hover: true, tooltipDelay: 3600000, hideEdgesOnDrag: BIG, hideEdgesOnZoom: BIG, zoomSpeed: 0.7, multiselect: false },
});
const bodyNodes = () => network.body.nodes;
let firstLayout = true;
network.on("stabilizationProgress", (p) => {
  document.getElementById("loading").hidden = false;
  document.getElementById("loading").textContent = `Laying out… ${Math.round((100 * p.iterations) / p.total)}%`;
});
network.on("stabilizationIterationsDone", () => {
  network.setOptions({ physics: { enabled: false } });
  document.getElementById("loading").hidden = true;
  if (!firstLayout) return;
  firstLayout = false;
  const ms = Math.round(performance.now() - T0);
  document.body.dataset.ready = "1";
  document.body.dataset.readyMs = String(ms);
  document.getElementById("stats").textContent =
    `${N} notes · ${DATA.edges.length} links · laid out in ${(ms / 1000).toFixed(1)} s · map ${DATA.schema}`;
  const sel = hash.get("select");
  if (sel) { const n = DATA.nodes.find((m) => m.slug === sel); if (n) goTo(n.id, false); }
});
function relayout() {
  network.setOptions({ physics: { enabled: true } });
  network.stabilize(BIG ? 120 : 300);
}

// ---------------------------------------------------------------- focus fade (nothing moves; only opacity)
const fade = { id: null, a: 0, from: 0, to: 0, t0: 0 };
function setFocus(id) {
  const target = id ? 1 : 0;
  if (id) fade.id = id;
  if (fade.to === target && (!id || fade.id === id)) { network.redraw(); return; }
  Object.assign(fade, { from: fade.a, to: target, t0: performance.now() });
  const step = () => {
    const t = Math.min(1, (performance.now() - fade.t0) / 180);
    fade.a = fade.from + (fade.to - fade.from) * (1 - Math.pow(1 - t, 3));
    if (t >= 1 && fade.to === 0) fade.id = null;
    network.redraw();
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const focusId = () => state.hover || state.selected;

// ---------------------------------------------------------------- drawing: clouds, veil, labels
function viewBounds() {
  const c = network.canvas.frame.canvas;
  const a = network.DOMtoCanvas({ x: 0, y: 0 }), b = network.DOMtoCanvas({ x: c.clientWidth, y: c.clientHeight });
  return { x0: a.x, y0: a.y, x1: b.x, y1: b.y };
}
function placeLabel(ctx, text, x, y, scale, placed, colourText, weight) {
  const fs = LABEL_PX / scale;
  ctx.font = `${weight} ${fs}px ${FONT}`;
  const w = ctx.measureText(text).width, h = fs * 1.3;
  const box = { x0: x - w / 2 - 2 / scale, y0: y, x1: x + w / 2 + 2 / scale, y1: y + h };
  for (const p of placed) if (box.x0 < p.x1 && box.x1 > p.x0 && box.y0 < p.y1 && box.y1 > p.y0) return false;
  placed.push(box);
  ctx.lineWidth = 2.5 / scale; ctx.strokeStyle = L.halo; ctx.lineJoin = "round";
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  ctx.strokeText(text, x, y); ctx.fillStyle = colourText; ctx.fillText(text, x, y);
  return true;
}
const short = (s, k = 34) => (s.length > k ? s.slice(0, k - 1) + "…" : s);
function drawLabels(ctx, ids, scale, b, placed, all, strongId) {
  const bn = bodyNodes();
  const cand = [];
  for (const id of ids) {
    const p = bn[id]; if (!p) continue;
    if (p.x < b.x0 || p.x > b.x1 || p.y < b.y0 || p.y > b.y1) continue;
    const n = byId.get(id);
    const important = n.type === "hub" || n.degree >= ALWAYS_DEGREE;
    if (!all && classic() && !((n.type === "hub" || n.type === "area") && scale >= 1.3)) continue;
    if (!all && !important && scale < 1.1) continue;
    cand.push([id === strongId ? 1e9 : (important ? 1e6 : 0) + n.degree, n, p]);
  }
  cand.sort((a, c) => c[0] - a[0]);
  let drawn = 0;
  for (const [, n, p] of cand) {
    if (drawn > 450) break;
    const strong = n.id === strongId;
    const gap = (strong ? 9 : 3) / scale;
    if (placeLabel(ctx, short(n.name), p.x, p.y + radius(n) + gap, scale, placed, strong ? L.strong : L.label, strong ? 600 : 400)) drawn++;
  }
}
function drawEdgeLabels(ctx, scale, b, placed, onlyEdges) {
  if (!state.edgeLabels || scale < 1.0) return;
  const bn = bodyNodes();
  let drawn = 0;
  const list = onlyEdges || edgesView.get().filter((item) => typeof item.id === "number").map((item) => edgeById.get(item.id));
  for (const e of list) {
    if (drawn > 300) break;
    const p = bn[e.from], q = bn[e.to]; if (!p || !q) continue;
    const x = (p.x + q.x) / 2, y = (p.y + q.y) / 2;
    if (x < b.x0 || x > b.x1 || y < b.y0 || y > b.y1) continue;
    if (placeLabel(ctx, e.kind === "mention" ? "mentions" : e.label, x, y - 6 / scale, scale * 1.15, placed, L.label, 400)) drawn++;
  }
}
network.on("beforeDrawing", (ctx) => {
  if (state.style !== "clouds") return;
  const bn = bodyNodes(), scale = network.getScale();
  const groups = new Map();
  for (const id of visible) {
    const n = byId.get(id), k = colourKey(n), p = bn[id];
    if (!p || !k || k === "cross") continue;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push([p.x, p.y]);
  }
  for (const [k, pts] of groups) {
    if (pts.length < 2) continue;
    const cx = pts.reduce((s, q) => s + q[0], 0) / pts.length, cy = pts.reduce((s, q) => s + q[1], 0) / pts.length;
    const ds = pts.map((q) => Math.hypot(q[0] - cx, q[1] - cy)).sort((a, c) => a - c);
    const r = ds[Math.floor(ds.length * 0.85)] + 60;
    const g = ctx.createRadialGradient(cx, cy, r * 0.15, cx, cy, r);
    const probe = { area: k, shelf: k };
    g.addColorStop(0, areaColour(probe, L.cloudA)); g.addColorStop(0.7, areaColour(probe, L.cloudA * 0.7)); g.addColorStop(1, areaColour(probe, 0));
    ctx.save(); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2 * Math.PI); ctx.fill();
    const fs = 12 / scale;
    ctx.font = `600 ${fs}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
    ctx.fillStyle = areaColour(probe, 0.9);
    ctx.fillText((AREA_NAMES[k] || k).toUpperCase(), cx, cy - r * 0.72);
    ctx.restore();
  }
});
network.on("afterDrawing", (ctx) => {
  const scale = network.getScale(), b = viewBounds(), placed = [];
  const id = fade.id;
  if (!id || fade.a <= 0.01 || !visible.has(id)) {
    drawLabels(ctx, visible, scale, b, placed, false, null);
    drawEdgeLabels(ctx, scale, b, placed, null);
    return;
  }
  const a = fade.a;
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = L.veil;
  ctx.fillRect(b.x0 - 10, b.y0 - 10, b.x1 - b.x0 + 20, b.y1 - b.y0 + 20); ctx.restore();
  const bn = bodyNodes(), focus = byId.get(id);
  const near = new Set([id]);
  const mine = edgesOf.get(id).filter((e) => edgesView.get(e.id));
  const linkColour = state.style === "muted" ? areaColour(focus) : L.accent;
  for (const e of mine) {
    near.add(e.from); near.add(e.to);
    const p = bn[e.from], q = bn[e.to]; if (!p || !q) continue;
    ctx.save(); ctx.globalAlpha = a * (classic() || e.kind === "link" ? 0.9 : 0.55);
    ctx.beginPath(); ctx.moveTo(p.x, p.y);
    if (classic()) {
      ctx.lineTo(q.x, q.y);
      ctx.strokeStyle = linkColour; ctx.lineWidth = 1.5 / Math.max(scale, 0.5);
    } else {
      const mx = (p.x + q.x) / 2 + (q.y - p.y) * 0.08, my = (p.y + q.y) / 2 - (q.x - p.x) * 0.08;
      ctx.quadraticCurveTo(mx, my, q.x, q.y);
      ctx.strokeStyle = linkColour; ctx.lineWidth = (e.kind === "link" ? 1.4 : 0.9) / Math.max(scale, 0.5);
      if (e.kind !== "link") ctx.setLineDash([3 / scale, 3 / scale]);
    }
    ctx.stroke(); ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = a;
  for (const nid of near) {
    const p = bn[nid]; if (p) drawNode(ctx, byId.get(nid), p.x, p.y, { focus: true, selected: nid === id });
  }
  ctx.restore();
  drawLabels(ctx, [id, ...[...near].filter((x) => x !== id)], scale, b, placed, true, id);
  drawEdgeLabels(ctx, scale, b, placed, mine);
});

// ---------------------------------------------------------------- tooltip
const tip = document.getElementById("tip");
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function typeArea(n) { return `${esc(n.type)} · ${esc(AREA_NAMES[n.area] || n.area || n.shelf)}`; }
function tipAt(html, dom) {
  tip.innerHTML = html; tip.hidden = false;
  const r = document.getElementById("graph").getBoundingClientRect();
  let x = r.left + dom.x + 14, y = r.top + dom.y + 14;
  if (x + 340 > innerWidth) x = Math.max(8, innerWidth - 350);
  tip.style.left = `${x}px`; tip.style.top = `${Math.min(y, innerHeight - 160)}px`;
}
network.on("hoverNode", (p) => {
  state.hover = p.node; const n = byId.get(p.node);
  const body = show(n)
    ? `${n.description ? `<div>${esc(n.description)}</div>` : ""}${n.aliases.length ? `<div class="muted">Also: ${esc(n.aliases.join(", "))}</div>` : ""}`
    : `<div class="muted">Sensitive note: details hidden. Click it, then "Show".</div>`;
  tipAt(`<b>${esc(n.name)}</b><div class="muted">${typeArea(n)} · ${n.degree} links</div>${body}`, p.pointer.DOM);
  setFocus(p.node);
});
network.on("blurNode", () => { state.hover = null; tip.hidden = true; setFocus(state.selected); });
network.on("hoverEdge", (p) => {
  const e = edgeById.get(p.edge); if (!e) return;
  const from = byId.get(e.from);
  const verb = e.kind === "mention" ? "mentions" : e.label;
  const line = show(from) ? (e.line ? `<div class="muted">${esc(e.line)}</div>` : "") : `<div class="muted">Line hidden: sensitive note.</div>`;
  const kind = e.kind === "hub" ? " (hub link)" : e.kind === "mention" ? " (mention)" : "";
  tipAt(`<b>${esc(e.fromName)}</b> ${esc(verb)} <b>${esc(e.toName)}</b>${esc(kind)}${line}`, p.pointer.DOM);
});
network.on("blurEdge", () => { tip.hidden = true; });
network.on("dragStart", () => { tip.hidden = true; });

// ---------------------------------------------------------------- side panel
const info = document.getElementById("info");
function linkGroups(id) {
  const groups = new Map();
  for (const e of edgesOf.get(id)) {
    const out = e.from === id;
    const verb = out ? (e.kind === "mention" ? "mentions" : e.label) : e.back || e.label;
    const other = out ? e.to : e.from;
    const key = e.kind === "hub" ? `${verb} (hub)` : verb;
    if (!groups.has(key)) groups.set(key, new Map());
    groups.get(key).set(other, byId.get(other).name);
  }
  return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}
function showInfo(id) {
  if (!id) { info.innerHTML = `<span class="empty">Click a note to see its details.</span>`; return; }
  const n = byId.get(id);
  let html = `<h2>${esc(n.name)}</h2><div><span class="chip">${esc(n.type)}</span>`
    + `<span class="chip"><span class="swatch" style="width:9px;height:9px;margin-right:5px;background:${areaColour(n)}"></span>${esc(AREA_NAMES[n.area] || n.area || n.shelf)}</span></div>`
    + `<div class="muted" style="margin-top:4px">${esc(n.path)} · <a href="${esc(n.href)}" target="_blank" rel="noopener">open note</a></div>`;
  if (!show(n)) {
    html += `<div class="hidden-note">Sensitive note: description, aliases, summary and facts are hidden.<br>`
      + `<button id="reveal" type="button" style="margin-top:6px">Show</button></div>`;
  } else {
    if (n.description) html += `<h3>Description</h3><div>${esc(n.description)}</div>`;
    if (n.aliases.length) html += `<h3>Aliases</h3><div>${n.aliases.map((a) => `<span class="chip">${esc(a)}</span>`).join("")}</div>`;
    if (n.summary) html += `<h3>Summary</h3><div>${esc(n.summary)}</div>`;
    if (n.facts.length) html += `<h3>Facts (${n.facts.length})</h3><ul>${n.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>`;
    if (n.sensitive) html += `<button id="conceal" type="button">Hide again</button>`;
  }
  const groups = linkGroups(id);
  if (groups.length) {
    html += `<h3>Links</h3>`;
    for (const [verb, others] of groups) {
      html += `<h4>${esc(verb)}</h4>` + [...others.entries()].map(([oid, name]) =>
        `<div class="jump" data-id="${esc(oid)}">${esc(name)}</div>`).join("");
    }
  }
  info.innerHTML = html;
  info.querySelectorAll(".jump").forEach((el) => el.addEventListener("click", () => goTo(el.dataset.id, true)));
  const rv = document.getElementById("reveal");
  if (rv) rv.addEventListener("click", () => { state.revealed.add(id); showInfo(id); });
  const cc = document.getElementById("conceal");
  if (cc) cc.addEventListener("click", () => { state.revealed.delete(id); showInfo(id); });
}
network.on("selectNode", (p) => { state.selected = p.nodes[0]; showInfo(state.selected); setFocus(focusId()); });
network.on("deselectNode", () => { state.selected = null; showInfo(null); setFocus(state.hover); });
function goTo(id, animate) {
  if (!visible.has(id)) {
    state.hideHubs = false; state.areaOff.clear(); state.typeOff.clear();
    document.getElementById("hide-hubs").checked = false;
    document.querySelectorAll("#f-area input, #f-type input").forEach((cb) => { cb.checked = true; });
    refresh();
  }
  network.selectNodes([id]); state.selected = id; showInfo(id); setFocus(id);
  network.focus(id, { scale: Math.max(network.getScale(), 1.3),
    animation: animate ? { duration: 700, easingFunction: "easeInOutCubic" } : false });
}

// ---------------------------------------------------------------- physics: drag with springs, pin, unpin
let settleTimer = null;
network.on("dragStart", (p) => {
  if (!p.nodes.length) return;
  const id = p.nodes[0], near = adj.get(id);
  clearTimeout(settleTimer);
  nodesDS.update(DATA.nodes.map((n) => ({ id: n.id, fixed: n.id !== id && (!near.has(n.id) || state.pinned.has(n.id)) })));
  network.setOptions({ physics: { enabled: true, stabilization: { enabled: false } } });
});
network.on("dragEnd", (p) => {
  if (!p.nodes.length) return;
  const id = p.nodes[0];
  state.pinned.add(id);
  nodesDS.update({ id, fixed: true });
  settleTimer = setTimeout(() => {
    network.setOptions({ physics: { enabled: false } });
    nodesDS.update(DATA.nodes.map((n) => ({ id: n.id, fixed: state.pinned.has(n.id) })));
  }, 1200);
});
network.on("doubleClick", (p) => {
  if (!p.nodes.length) return;
  const id = p.nodes[0];
  state.pinned.delete(id); nodesDS.update({ id, fixed: false }); network.redraw();
});

// ---------------------------------------------------------------- search
const search = document.getElementById("search"), results = document.getElementById("results");
const norm = (s) => s.toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g, "");
search.addEventListener("input", () => {
  const q = norm(search.value.trim());
  results.innerHTML = "";
  if (!q) return;
  const hits = DATA.nodes.filter((n) => norm(n.name).includes(q) || n.slug.includes(q)
    || (show(n) && n.aliases.some((a) => norm(a).includes(q)))).slice(0, 12);
  for (const n of hits) {
    const li = document.createElement("li");
    li.innerHTML = `${esc(n.name)} <span class="muted">· ${esc(n.type)}</span>`;
    li.addEventListener("click", () => { goTo(n.id, true); results.innerHTML = ""; search.value = ""; });
    results.appendChild(li);
  }
});
search.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && results.firstChild) results.firstChild.click();
  if (ev.key === "Escape") { search.value = ""; results.innerHTML = ""; }
});

// ---------------------------------------------------------------- toggles and filters
document.getElementById("hide-hubs").addEventListener("change", (ev) => { state.hideHubs = ev.target.checked; refresh(); });
document.getElementById("show-mentions").addEventListener("change", (ev) => { state.mentions = ev.target.checked; refresh(); });
document.getElementById("edge-labels").addEventListener("change", (ev) => { state.edgeLabels = ev.target.checked; network.redraw(); });
function count(arr, f) { const m = new Map(); for (const x of arr) m.set(f(x), (m.get(f(x)) || 0) + 1); return m; }
function filterList(el, entries, set, swatch) {
  el.innerHTML = "";
  for (const [k, label, n] of entries) {
    const l = document.createElement("label");
    l.innerHTML = `<input type="checkbox" checked>${swatch ? `<span class="swatch" data-k="${esc(k)}"></span>` : ""}<span>${esc(label)}</span><span class="count">${n}</span>`;
    l.querySelector("input").addEventListener("change", (ev) => { ev.target.checked ? set.delete(k) : set.add(k); refresh(); });
    el.appendChild(l);
  }
}
const TYPE_ORDER = ["hub", "person", "place", "project", "goal", "decision", "event", "topic", "source", "concept", "framework", "journal"];
const areaCounts = count(DATA.nodes, colourKey);
const typeCounts = count(DATA.nodes, (n) => n.type);
const verbCounts = count(DATA.edges, verbKey);
const typeKeys = [...typeCounts.keys()].sort((a, b) => (TYPE_ORDER.indexOf(a) + 99) % 99 - (TYPE_ORDER.indexOf(b) + 99) % 99 || a.localeCompare(b));
filterList(document.getElementById("f-area"), keys.map((k) => [k, AREA_NAMES[k] || k, areaCounts.get(k)]), state.areaOff, true);
filterList(document.getElementById("f-type"), typeKeys.map((k) => [k, k, typeCounts.get(k)]), state.typeOff, false);
filterList(document.getElementById("f-verb"), [...verbCounts.keys()].sort().map((k) => [k, k, verbCounts.get(k)]), state.verbOff, false);

// ---------------------------------------------------------------- legend
const groupCounts = count(DATA.nodes, groupOf);
const groupKeys = Object.keys(GROUPS).filter((g) => groupCounts.get(g));
function legendCard() {
  const card = document.getElementById("legend-card");
  card.hidden = !classic();
  if (!classic()) return;
  card.style.background = L.card; card.style.border = `1px solid ${L.cardLine}`; card.style.color = L.label;
  const dots = state.colourBy === "area"
    ? keys.map((k) => [AREA_NAMES[k] || k, classicArea(k)])
    : groupKeys.map((g) => [GROUPS[g][0], GROUPS[g][1]]);
  card.innerHTML = `<b>Brain map</b><div>${dots.map(([name, c]) => `<span class="dot" style="color:${L.muted}"><i style="background:${c}"></i>${esc(name)}</span>`).join("")}</div>`
    + `<div class="s" style="color:${L.muted}">${N} notes, ${DATA.edges.length} links. Drag to pan, wheel to zoom, drag a note to move it.</div>`;
}
function legend() {
  legendCard();
  const la = document.getElementById("l-area"); la.innerHTML = "";
  document.getElementById("l-area-title").textContent = classic() && state.colourBy === "group" ? "Colours: type groups" : "Colours: areas";
  if (classic()) {
    const rows = state.colourBy === "area"
      ? keys.map((k) => [AREA_NAMES[k] || k, classicArea(k), areaCounts.get(k)])
      : groupKeys.map((g) => [GROUPS[g][0], GROUPS[g][1], groupCounts.get(g)]);
    for (const [name, c, n] of rows) {
      la.insertAdjacentHTML("beforeend", `<div class="legend-item"><span class="swatch" style="background:${c}"></span><span>${esc(name)}</span><span class="count">${n}</span></div>`);
    }
    const dot = (r) => `<svg width="34" height="28"><circle cx="17" cy="14" r="${r}" fill="${L.muted}"/></svg>`;
    const ln = (colour, label) => `<div class="legend-item"><svg width="34" height="10"><line x1="1" y1="5" x2="33" y2="5" stroke="${colour}" stroke-width="1.4"/></svg><span>${label}</span></div>`;
    document.getElementById("l-line").innerHTML = `<div class="legend-item">${dot(4)}${dot(8)}${dot(12)}<span>Size: number of links</span></div>`
      + ln(L.edge.replace(/[\d.]+\)$/, "0.6)"), "Link") + ln(L.accent, "Links of the focused note");
    document.querySelectorAll(".swatch[data-k]").forEach((s) => { s.style.background = swatch(s.dataset.k); });
    return;
  }
  if (state.style !== "muted") la.insertAdjacentHTML("beforeend", `<div class="muted" style="margin-bottom:4px">Shown on hover, on a selected note, and when filtering by area.</div>`);
  for (const k of keys) {
    const d = document.createElement("div"); d.className = "legend-item";
    d.innerHTML = `<span class="swatch" style="background:${areaColour({ area: k, shelf: k })}"></span><span>${esc(AREA_NAMES[k] || k)}</span><span class="count">${areaCounts.get(k)}</span>`;
    la.appendChild(d);
  }
  const c = (r, glow) => `<svg width="34" height="28"><circle cx="17" cy="14" r="${r}" fill="${nodeColour({ type: glow ? "hub" : "x", area: "cross", shelf: "cross" }, false)}" ${glow ? `style="filter:drop-shadow(0 0 4px ${L.hub})"` : ""}/></svg>`;
  const line = (dash, colour, label) => `<div class="legend-item"><svg width="34" height="10"><path d="M1 7 Q17 2 33 7" fill="none" stroke="${colour}" stroke-width="1.4" ${dash ? `stroke-dasharray="${dash}"` : ""}/></svg><span>${label}</span></div>`;
  document.getElementById("l-line").innerHTML =
    `<div class="legend-item">${c(4)}${c(8)}${c(12)}<span>Size: number of links</span></div>`
    + `<div class="legend-item">${c(11, true)}<span>Glow: a hub (one per area)</span></div>`
    + line("", L.edge.replace(/[\d.]+\)$/, "0.7)"), "Typed link: a verb from ## Links")
    + line("2 3", L.edge.replace(/[\d.]+\)$/, "0.7)"), "Mention: a [[link]] inside a note's text")
    + line("", L.hubEdge.replace(/[\d.]+\)$/, "0.35)"), "Hub link: a hub lists the note")
    + line("", L.accent, "Links of the focused note");
  document.querySelectorAll(".swatch[data-k]").forEach((s) => { s.style.background = areaColour({ area: s.dataset.k, shelf: s.dataset.k }); });
}

// ---------------------------------------------------------------- theme and style
const themeSel = document.getElementById("theme"), styleSel = document.getElementById("style");
function applyLook(edges = true) {
  L = look();
  document.getElementById("colour-by").disabled = !classic();
  document.getElementById("colour-by-row").title = classic() ? "" : "Colour by applies to the Classic style";
  document.getElementById("graph").style.background = L.bg;
  if (edges) edgesDS.update(DATA.edges.map((e) => ({ id: e.id, ...edgeStyle(e) })));
  legend(); if (state.selected) showInfo(state.selected);
  network.redraw();
}
function applyTheme(t) {
  state.theme = t; themeSel.value = t;
  if (t === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  applyLook();
}
function applyStyle(s, initial) {
  const was = state.style;
  state.style = STYLES.includes(s) ? s : "classic"; styleSel.value = state.style;
  edgesView.refresh(); network.setOptions({ edges: { smooth: smoothing() } });
  nodesDS.update(DATA.nodes.map((n) => ({ id: n.id, size: radius(n) })));
  applyLook();
  if (!initial && (was === "clouds") !== (state.style === "clouds")) relayout();
}
themeSel.addEventListener("change", () => { storeSet("yggdras-theme", themeSel.value); applyTheme(themeSel.value); });
styleSel.addEventListener("change", () => { storeSet("yggdras-style", styleSel.value); applyStyle(styleSel.value, false); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (state.theme === "system") applyLook(); });
const colourSel = document.getElementById("colour-by");
colourSel.addEventListener("change", () => { state.colourBy = colourSel.value; storeSet("yggdras-colour-by", colourSel.value); applyLook(false); });
themeSel.value = state.theme; styleSel.value = state.style; colourSel.value = state.colourBy;
applyLook(false);
if (hash.get("labels") === "1") { state.edgeLabels = true; document.getElementById("edge-labels").checked = true; }
if (document.fonts) document.fonts.load(`400 12px "Inter"`).then(() => network.redraw()).catch(() => {});
document.getElementById("stats").textContent = `${N} notes · ${DATA.edges.length} links`;
</script>
