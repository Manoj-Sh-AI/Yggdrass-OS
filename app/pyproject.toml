[project]
name = "yggdras"
version = "0.0.1"
description = "Yggdras: personal second brain"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.80",
    "mcp>=1.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.scripts]
yggdras = "yggdras.interface.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yggdras"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
