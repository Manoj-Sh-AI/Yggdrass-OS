[project]
name = "yggdress-application"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "temporalio>=1.36,<2",
    "mcp>=1.20,<2", "cryptography>=44", "httpx>=0.28,<1", "anthropic==2.12.0",
    "assistant-stream==0.0.38", "pywebpush>=2,<3"]

[project.optional-dependencies]
voice = ["livekit-agents[silero]>=1.3,<2", "firebase-admin>=7,<8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yggdress_app"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "yggdress_app/migrations"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "pytest-timeout==2.4.0",
    "pytest-split==0.11.0",
    "pytest-testmon>=2.1,<2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "slow: longer than the gate budget; CI only (planning/agentic-engineering.md item 25)",
    "flaky: known nondeterministic; excluded from every gate until fixed (item 19)",
    "schema_pinned: asserts the exact schema, so it changes with every additive migration; the migrations contract job (old code, new schema) skips it",
]

[tool.ruff]
line-length = 100

